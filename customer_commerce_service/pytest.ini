[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    integration: marks tests as integration tests (require running DB + Redis)
    unit: marks tests as unit tests (no external services required)
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    -v
    -m "not integration"
filterwarnings =
    ignore::DeprecationWarning
