name: Customer & Commerce Service — CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "customer_commerce_service/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "customer_commerce_service/**"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nutmeals-customer-commerce
  WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/nutmeals-customer-commerce-worker

defaults:
  run:
    working-directory: customer_commerce_service

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Lint + type check
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: customer_commerce_service/requirements.txt

      - name: Install linting deps
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: Mypy type check
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Unit tests with coverage gate
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests (≥80% coverage)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nut_meals_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nut_meals_commerce_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-test-secret
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: customer_commerce_service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations (test DB)
        run: alembic upgrade head

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=app --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: customer_commerce_service/coverage.xml
          flags: customer-commerce
          token: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Security scan
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit + Safety
        run: pip install bandit safety

      - name: Bandit SAST scan
        run: bandit -r app/ -ll -x tests/

      - name: Safety dependency check
        run: safety check -r requirements.txt

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Build & push Docker images (main branch only)
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (API image)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./customer_commerce_service
          file: ./customer_commerce_service/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (Worker image)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WORKER_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./customer_commerce_service
          file: ./customer_commerce_service/Dockerfile.worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Deploy to OCI (main branch only)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to OCI Container Instances
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure OCI CLI
        uses: oracle-actions/configure-oracle-cloud@v1
        with:
          user: ${{ secrets.OCI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          region: ${{ secrets.OCI_REGION }}
          key_content: ${{ secrets.OCI_KEY_CONTENT }}

      - name: Pull secrets from OCI Vault
        run: |
          SECRET_KEY=$(oci secrets secret-bundle get \
            --secret-id "${{ secrets.OCI_SECRET_KEY_OCID }}" \
            --query 'data."secret-bundle-content".content' --raw-output \
            | base64 -d)
          echo "SECRET_KEY=${SECRET_KEY}" >> $GITHUB_ENV

      - name: Run Alembic migrations on production DB
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
            ${{ env.IMAGE_NAME }}:latest \
            alembic upgrade head

      - name: Update OCI Container Instance (API)
        run: |
          oci container-instances container-instance update \
            --container-instance-id "${{ secrets.OCI_API_INSTANCE_ID }}" \
            --containers "[{\"imageUrl\": \"${{ env.IMAGE_NAME }}:latest\"}]" \
            --wait-for-state SUCCEEDED

      - name: Update OCI Container Instance (Worker)
        run: |
          oci container-instances container-instance update \
            --container-instance-id "${{ secrets.OCI_WORKER_INSTANCE_ID }}" \
            --containers "[{\"imageUrl\": \"${{ env.WORKER_IMAGE }}:latest\"}]" \
            --wait-for-state SUCCEEDED

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text": "✅ customer-commerce deployed successfully — SHA ${{ github.sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text": "❌ customer-commerce deploy FAILED — SHA ${{ github.sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
