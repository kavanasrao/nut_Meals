name: Procurement Service CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "services/procurement/**"
      - ".github/workflows/procurement-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/procurement/**"
      - ".github/workflows/procurement-ci.yml"

# NOTE: this workflow assumes the procurement service lives at
# services/procurement/ in the monorepo. Adjust `working-directory`
# and the `paths` filters above if your layout differs.

defaults:
  run:
    working-directory: services/procurement

env:
  IMAGE_NAME: nutmeals/procurement-service
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy app --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: procurement
          POSTGRES_DB: procurement_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U procurement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://procurement:procurement@localhost:5432/procurement_test_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET_KEY: ci-test-secret
      FINANCE_SERVICE_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Run tests with coverage (fails under 80%)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/procurement/coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt || true
        # `|| true` keeps this informational for now; flip to hard-fail once
        # the team has triaged the current baseline of findings.

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: services/procurement
          file: services/procurement/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push worker image
        uses: docker/build-push-action@v6
        with:
          context: services/procurement
          file: services/procurement/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-worker:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Trigger staging deployment (e.g. kubectl set image / helm upgrade)."
          echo "Secrets (DB creds, JWT key, Finance API key) are pulled from"
          echo "OCI Vault by the deployment target at rollout time, not injected here."

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Trigger production deployment via the platform's release pipeline."
          echo "Requires manual approval via the 'production' GitHub Environment gate."
