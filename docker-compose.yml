# Nutmeals — Complete Microservices Docker Compose
# Rewritten to support the updated api-gateway (full 17-service reverse proxy).
#
# Changes from the previous version, and why:
#
#   1. delivery-service REMOVED.
#      `./delivery-service` does not exist in this repository and the new
#      gateway no longer routes to it. The old file referenced it and would
#      fail on `docker compose build`.
#
#   2. customer_commerce_service and procurement_service ADDED.
#      Both exist in the repo with real code but were entirely missing from
#      the old docker-compose.yml. The new gateway routes to both
#      (/api/v1/customer, /api/v1/procurement), so they must run.
#
#   3. Internal container ports fixed for 4 services whose Dockerfile
#      actually binds to a DIFFERENT port than what compose was mapping to:
#        - notification-service : binds 8000  (was mapped 8003:8003)
#        - inventory_service     : binds 8001  (was mapped 8010:8000)
#        - crm_service           : binds 8005  (was mapped 8011:8000)
#        - manufacturing_service : binds 8001  (was mapped 8014:8000)
#      External host ports are left as before for anyone with muscle memory
#      around them; only the CONTAINER side of each mapping was corrected.
#
#   4. env_prefix mismatches fixed. Several services' Settings classes use
#      pydantic's `env_prefix`, so a plain `DATABASE_URL` env var was being
#      silently ignored and the app fell back to a broken placeholder
#      default (e.g. host "postgrey", which does not exist):
#        - catalog_service   -> needs CATALOG_*
#        - logistics_service -> needs LOGISTICS_*
#        - seo_service       -> needs SEO_*
#        - security-service  -> needs SECURITY_*
#        - admin_cms_service -> needs ADMIN_CMS_*
#
#   5. Per-service databases. init-dbs.sql now creates one database per
#      service and every DATABASE_URL below points at its own database,
#      instead of everyone sharing one `nutmeals_db` while 7 unused
#      databases sat empty (see init-dbs.sql comments).
#
#   6. security-service now actually gets a database + depends_on postgres.
#      It ships Alembic migrations and a required DATABASE_URL field, but
#      the old compose file only gave it `depends_on: redis` and no DB at
#      all — it would have failed on startup.
#
#   7. Downstream service-to-service URLs corrected to the port each target
#      container ACTUALLY listens on internally (not always the same as
#      its external host mapping) — several of these were wrong even in
#      the services' own code defaults (e.g. catalog_service's own default
#      INVENTORY_SERVICE_URL pointed at :8000, but inventory actually binds
#      :8001). Set explicitly here to override those bad defaults.
#
#   8. UNRESOLVED, NOT fixable from docker-compose alone — flagged, not
#      papered over:
#        - Three services (logistics_service, seo_service, admin_cms_service)
#          verify JWT with RS256 + a public key, while every other service
#          (11 of them) verifies with HS256 + a shared secret. Tokens issued
#          by user-service (HS256) will NOT validate against those three
#          unless/until someone adds real RSA keypair issuance — a shared
#          JWT_SECRET env var cannot bridge that gap. JWT_PUBLIC_KEY is left
#          blank below as a placeholder; auth against these 3 services will
#          not work until that's addressed in code.
#        - crm_service's own config.py requires DATABASE_URL and SECRET_KEY
#          (Field(...), no defaults) and references legacy service names
#          that don't exist in this stack (AUTH_SERVICE_URL, PRODUCT_SERVICE_URL,
#          pointing at ports 8001-8006 for services with different real
#          names/ports). Those specific cross-service calls will silently
#          hit nothing — only DATABASE_URL/SECRET_KEY are wired below since
#          those are the two required to avoid a startup crash.
#        - notification-service has two competing config.py/main.py pairs
#          (root main.py + app/main.py, each importing a different config
#          module). The Dockerfile runs `app.main:app`, so `app/config.py`
#          (lowercase fields, port 8000) is the one actually used — the
#          other pair is dead code, left as-is since removing it is a code
#          change, not a compose change.
#
#   9. api-gateway ALSO needs matching code changes — this compose file
#      only supplies the right env vars. The gateway's config.py and auth.py
#      must be updated to (a) declare the new *_SERVICE_URL settings fields
#      and (b) make get_current_user an async function, or the container
#      will crash on startup / on the first authenticated request
#      regardless of what's in this file. See the config.py/auth.py fixes
#      provided alongside this compose file.

version: "3.9"

x-common-env: &common-env
  ENVIRONMENT: local
  DEBUG: "true"
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: super_secret_jwt_key_change_in_production
  JWT_SECRET_KEY: super_secret_jwt_key_change_in_production   # same value, different field name some services use
  JWT_ALGORITHM: HS256
  INTERNAL_SERVICE_TOKEN: change_me_internal_token

services:

  ####################################################
  # Infrastructure
  ####################################################

  postgres:
    image: postgres:16-alpine
    container_name: nutmeals-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kanni3750
      POSTGRES_DB: nutmeals_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nutmeals-network

  redis:
    image: redis:7-alpine
    container_name: nutmeals-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nutmeals-network

  ####################################################
  # API Gateway
  ####################################################

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      SERVICE_NAME: api-gateway

      SECURITY_SERVICE_URL: http://security-service:8000
      USER_SERVICE_URL: http://user-service:8005
      CATALOG_SERVICE_URL: http://catalog-service:8000
      MEAL_SERVICE_URL: http://meal-service:8006
      CUSTOMER_COMMERCE_SERVICE_URL: http://customer-commerce-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8001
      ORDER_SERVICE_URL: http://order-service:8001
      PAYMENT_SERVICE_URL: http://payment-service:8002
      MANUFACTURING_SERVICE_URL: http://manufacturing-service:8001
      PROCUREMENT_SERVICE_URL: http://procurement-service:8000
      LOGISTICS_SERVICE_URL: http://logistics-service:8000
      CRM_SERVICE_URL: http://crm-service:8005
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      SEO_SERVICE_URL: http://seo-service:8000
      FINANCE_SERVICE_URL: http://finance-service:8000
      ADMIN_SERVICE_URL: http://admin-service:8007
      ADMIN_CMS_SERVICE_URL: http://admin-cms-service:8000

      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MAX_REQUESTS: 100
      RATE_LIMIT_AUTH_MAX_REQUESTS: 10
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # User Service
  ####################################################

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      <<: *common-env
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_users
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      ORDER_SERVICE_URL: http://order-service:8001
      CRM_SERVICE_URL: http://crm-service:8005
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Order Service
  ####################################################

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      SERVICE_NAME: order-service
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_orders
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Payment Service
  ####################################################

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_payments
      JUSPAY_API_KEY: ${JUSPAY_API_KEY:-}
      JUSPAY_MERCHANT_ID: ${JUSPAY_MERCHANT_ID:-}
      JUSPAY_BASE_URL: https://sandbox.juspay.in
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Notification Service
  # Actually binds container port 8000 (app/main.py + app/config.py) —
  # NOT 8003. Host port kept at 8003 for continuity; container side fixed.
  ####################################################

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_notifications
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Meal Service
  ####################################################

  meal-service:
    build:
      context: ./meal-service
      dockerfile: Dockerfile
    container_name: meal-service
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      <<: *common-env
      SERVICE_NAME: meal-service
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_meals
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Admin Service
  ####################################################

  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: admin-service
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      <<: *common-env
      SERVICE_NAME: admin-service
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_admin
      USER_SERVICE_URL: http://user-service:8005
      ORDER_SERVICE_URL: http://order-service:8001
      PAYMENT_SERVICE_URL: http://payment-service:8002
      MEAL_SERVICE_URL: http://meal-service:8006
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Admin CMS Service — needs ADMIN_CMS_ env prefix.
  # Verifies JWT via RS256 public key, not the shared HS256 secret —
  # JWT_PUBLIC_KEY left blank; see top-of-file note #8.
  ####################################################

  admin_cms_service:
    build:
      context: ./admin_cms_service
      dockerfile: Dockerfile
    container_name: admin-cms-service
    restart: unless-stopped
    ports:
      - "8008:8000"
    environment:
      ADMIN_CMS_ENVIRONMENT: local
      ADMIN_CMS_DEBUG: "true"
      ADMIN_CMS_DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_admin_cms
      ADMIN_CMS_REDIS_URL: redis://redis:6379/0
      ADMIN_CMS_CELERY_BROKER_URL: redis://redis:6379/1
      ADMIN_CMS_CELERY_RESULT_BACKEND: redis://redis:6379/2
      ADMIN_CMS_JWT_PUBLIC_KEY: ""
      ADMIN_CMS_JWT_ALGORITHM: RS256
      ADMIN_CMS_INTERNAL_SERVICE_TOKEN: change_me_internal_token
      ADMIN_CMS_FINANCE_SERVICE_URL: http://finance-service:8000
      ADMIN_CMS_ORDERS_SERVICE_URL: http://order-service:8001
      ADMIN_CMS_LOGISTICS_SERVICE_URL: http://logistics-service:8000
      ADMIN_CMS_PAYMENTS_SERVICE_URL: http://payment-service:8002
      ADMIN_CMS_INVENTORY_SERVICE_URL: http://inventory-service:8001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Catalog Service — needs CATALOG_ env prefix.
  ####################################################

  catalog_service:
    build:
      context: ./catalog_service
      dockerfile: Dockerfile
    container_name: catalog-service
    restart: unless-stopped
    ports:
      - "8009:8000"
    environment:
      CATALOG_ENVIRONMENT: local
      CATALOG_DEBUG: "true"
      CATALOG_DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_catalog
      CATALOG_REDIS_URL: redis://redis:6379/0
      CATALOG_CELERY_BROKER_URL: redis://redis:6379/1
      CATALOG_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CATALOG_JWT_SECRET_KEY: super_secret_jwt_key_change_in_production
      CATALOG_JWT_ALGORITHM: HS256
      CATALOG_INVENTORY_SERVICE_URL: http://inventory-service:8001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Inventory Service
  # Actually binds container port 8001 — NOT 8000.
  ####################################################

  inventory_service:
    build:
      context: ./inventory_service
      dockerfile: Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    ports:
      - "8010:8001"
    environment:
      <<: *common-env
      SERVICE_NAME: inventory-service
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_inventory
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # CRM Service
  # Actually binds container port 8005 — NOT 8000.
  # Own config.py requires DATABASE_URL + SECRET_KEY (no defaults) — both
  # supplied below. Its AUTH_SERVICE_URL / PRODUCT_SERVICE_URL fields
  # reference services that don't exist under those names in this stack;
  # left unwired (see note #8).
  ####################################################

  crm_service:
    build:
      context: ./crm_service
      dockerfile: Dockerfile
    container_name: crm-service
    restart: unless-stopped
    ports:
      - "8011:8005"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_crm
      SECRET_KEY: super_secret_jwt_key_change_in_production
      ALGORITHM: HS256
      REDIS_URL: redis://redis:6379/0
      ORDER_SERVICE_URL: http://order-service:8001
      PAYMENT_SERVICE_URL: http://payment-service:8002
      FINANCE_SERVICE_URL: http://finance-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Finance Service
  ####################################################

  finance-service:
    build:
      context: ./finance-service
      dockerfile: Dockerfile
    container_name: finance-service
    restart: unless-stopped
    ports:
      - "8012:8000"
    environment:
      <<: *common-env
      SERVICE_NAME: finance-service
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_finance
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Logistics Service — needs LOGISTICS_ env prefix.
  # Verifies JWT via RS256 public key, not the shared HS256 secret —
  # JWT_PUBLIC_KEY left blank; see top-of-file note #8.
  ####################################################

  logistics_service:
    build:
      context: ./logistics_service
      dockerfile: Dockerfile
    container_name: logistics-service
    restart: unless-stopped
    ports:
      - "8013:8000"
    environment:
      LOGISTICS_ENVIRONMENT: development
      LOGISTICS_ENFORCE_HTTPS: "false"
      LOGISTICS_DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_logistics
      LOGISTICS_REDIS_URL: redis://redis:6379/0
      LOGISTICS_CELERY_BROKER_URL: redis://redis:6379/1
      LOGISTICS_CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOGISTICS_DELHIVERY_API_BASE: https://staging-express.delhivery.com
      LOGISTICS_DELHIVERY_API_TOKEN: changeme
      LOGISTICS_INDIA_POST_API_BASE: https://api.indiapost.gov.in
      LOGISTICS_INDIA_POST_API_KEY: changeme
      LOGISTICS_ORDERS_SERVICE_URL: http://order-service:8001
      LOGISTICS_INVENTORY_SERVICE_URL: http://inventory-service:8001
      LOGISTICS_JWT_PUBLIC_KEY: ""
      LOGISTICS_JWT_ALGORITHM: RS256
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Manufacturing Service
  # Actually binds container port 8001 — NOT 8000.
  ####################################################

  manufacturing_service:
    build:
      context: ./manufacturing_service
      dockerfile: Dockerfile
    container_name: manufacturing-service
    restart: unless-stopped
    ports:
      - "8014:8001"
    environment:
      <<: *common-env
      SERVICE_NAME: manufacturing-service
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_manufacturing
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # SEO Service — needs SEO_ env prefix.
  # Verifies JWT via RS256 public key, not the shared HS256 secret —
  # JWT_PUBLIC_KEY left blank; see top-of-file note #8.
  ####################################################

  seo_service:
    build:
      context: ./seo_service
      dockerfile: Dockerfile
    container_name: seo-service
    restart: unless-stopped
    ports:
      - "8015:8000"
    environment:
      SEO_ENVIRONMENT: local
      SEO_DEBUG: "true"
      SEO_DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_seo
      SEO_REDIS_URL: redis://redis:6379/0
      SEO_JWT_PUBLIC_KEY: ""
      SEO_JWT_ALGORITHM: RS256
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Cart Checkout Service
  ####################################################

  cart_checkout_ext:
    build:
      context: ./cart_checkout_ext
      dockerfile: Dockerfile
    container_name: cart-checkout-service
    restart: unless-stopped
    ports:
      - "8016:8000"
    environment:
      <<: *common-env
      SERVICE_NAME: cart-checkout-service
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_cart_checkout
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Security Service — needs SECURITY_ env prefix.
  # Now actually gets a database (previous compose only depended on redis).
  ####################################################

  security-service:
    build:
      context: ./security-service
      dockerfile: Dockerfile
    container_name: security-service
    restart: unless-stopped
    ports:
      - "8017:8000"
    environment:
      SECURITY_ENVIRONMENT: local
      SECURITY_DEBUG: "true"
      SECURITY_DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_security
      SECURITY_REDIS_URL: redis://redis:6379/0
      SECURITY_JWT_SECRET: super_secret_jwt_key_change_in_production
      SECURITY_JWT_ALGORITHM: HS256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Customer & Commerce Service (previously missing from compose entirely)
  ####################################################

  customer_commerce_service:
    build:
      context: ./customer_commerce_service
      dockerfile: Dockerfile
    container_name: customer-commerce-service
    restart: unless-stopped
    ports:
      - "8018:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_customer_commerce
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: super_secret_jwt_key_change_in_production
      JWT_ALGORITHM: HS256
      FINANCE_SERVICE_URL: http://finance-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Procurement Service (previously missing from compose entirely)
  ####################################################

  procurement_service:
    build:
      context: ./procurement_service
      dockerfile: Dockerfile
    container_name: procurement-service
    restart: unless-stopped
    ports:
      - "8019:8000"
    environment:
      SERVICE_NAME: procurement-service
      ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:kanni3750@postgres:5432/nutmeals_procurement
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: super_secret_jwt_key_change_in_production
      JWT_ALGORITHM: HS256
      FINANCE_SERVICE_BASE_URL: http://finance-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

  ####################################################
  # Infrastructure Service (Optional)
  ####################################################

  nutmeals-infra:
    build:
      context: ./nut_meals_infra/docker
      dockerfile: Dockerfile
    container_name: nutmeals-infra
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutmeals-network

####################################################
# Volumes
####################################################

volumes:
  postgres_data:
    driver: local

  redis_data:
    driver: local

####################################################
# Networks
####################################################

networks:
  nutmeals-network:
    driver: bridge